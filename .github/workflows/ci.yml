name: CI

# Every push and every pull request, as opposed to the release workflow which
# only fires on a tag.
#
# This is not merely convenience. Windows Smart App Control, in enforcement mode,
# blocks freshly built unsigned assemblies from loading -- so on a developer
# machine with it switched on, `dotnet test` can fail with 0x800711C7 for reasons
# that have nothing to do with the code. A clean runner is then the only place a
# green suite means anything.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Photobooth.Web/package-lock.json

      # Typechecks as well as bundles: `npm run build` is `tsc -b && vite build`,
      # so a type error in the operator or guest screens fails here rather than
      # being discovered on an iPad at an event.
      - name: Build the frontend
        working-directory: src/Photobooth.Web
        run: |
          npm ci
          npm run build

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=minimal"
